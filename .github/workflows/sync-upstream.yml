name: Sync upstream dev

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Enable auto-merge when the PR is conflict-free'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream dev into plauder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plauder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: plauder
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: bash .github/scripts/sync-upstream.sh
