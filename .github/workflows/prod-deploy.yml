# Disabled on the plauderparty fork — we deploy via Ansible, not Netlify/Docker Hub.
# Upstream Cinny publishes releases; do not create releases on this fork (would re-enable triggers).
name: Production deploy (disabled)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'This workflow is intentionally disabled on the fork'
        required: false
        default: 'noop'

jobs:
  noop:
    name: Skipped on fork
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "prod-deploy is disabled on plauderparty/cinny."
          echo "Theme/branding ships on the plauder branch; production updates via Ansible update-cinny.sh."
